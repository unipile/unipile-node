name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68  # v4.2.2

      - uses: actions/setup-node@1d0ff469b08a2afce806fdebbe7d45b6a7c525b0  # v4.2.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm publish --access public --ignore-scripts
