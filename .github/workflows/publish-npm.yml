name: Publish to npm

on:
  pull_request:
    types: [closed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      contains(github.event.pull_request.labels.*.name, 'sdk-release'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.argv[1])) process.exit(1)' "$VERSION" || {
            echo "::error::Invalid package version: $VERSION"
            exit 1
          }

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $REF_NAME does not match package version $VERSION"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REF" != "chore/sdk-update-$VERSION" ]; then
            echo "::error::Release PR branch $PR_HEAD_REF does not match package version $VERSION"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          npm run clean
          npm run build

      - name: Check npm release
        id: npm_release
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          LATEST_VERSION="$(npm view "$PACKAGE_NAME" version --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))")"

          if npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACKAGE_NAME@$VERSION is already published"
            exit 0
          fi

          node -e '
            const candidate = process.argv[1].split(".").map(Number);
            const latest = process.argv[2].split(".").map(Number);
            const is_newer = candidate.some((value, index) => value > latest[index] && candidate.slice(0, index).every((part, part_index) => part === latest[part_index]));
            if (!is_newer) process.exit(1);
          ' "$VERSION" "$LATEST_VERSION" || {
            echo "::error::Refusing to publish stale version $VERSION; npm latest is $LATEST_VERSION"
            exit 1
          }

          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: github.event_name != 'push'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          fi

          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Tag $TAG already points to $REMOTE_SHA instead of $RELEASE_SHA"
              exit 1
            fi
            echo "::notice::Tag $TAG already exists on the release commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to npm
        if: steps.npm_release.outputs.published != 'true'
        run: npm publish --access public --ignore-scripts
